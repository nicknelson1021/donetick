name: Custom Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - repeat-overdue-reminders
      - codex/v0.1.76-repeat-reminders

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend fork
        uses: actions/checkout@v4
        with:
          repository: nicknelson1021/frontend
          # Pin the verified v0.1.76 repeat-reminder frontend for reproducible images.
          ref: c98d46ee38ca8a8e8a4cfdd53f1a2f9a6bc55751
          path: frontend-code

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-code/package-lock.json

      - name: Build frontend
        run: |
          cd frontend-code
          npm ci
          npm run build-selfhosted

      - name: Copy frontend build
        run: |
          rm -rf frontend/dist
          cp -R frontend-code/dist frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Test backend
        run: go test ./...

      - name: Build backend binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o donetick .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nicknelson1021
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ghcr.io/nicknelson1021/donetick:repeat-overdue
